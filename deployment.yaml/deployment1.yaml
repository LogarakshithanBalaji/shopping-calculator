name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write  # Allows the workflow to commit the tag update back to your repository

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:${{ github.sha }}

    - name: Automatically Update and Commit Manifest Tag
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Swaps the old image string with the live running hash
        sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:${{ github.sha }}|g" k8s-deployment.yaml
        
        git add k8s-deployment.yaml
        git commit -m "chore: dynamically update image tag to match push [skip ci]" || echo "No changes to commit"
        git push