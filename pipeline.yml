name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: (1) Source Code - Checkout
      uses: actions/checkout@v4

    - name: (2) Continuous Integration - Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: (2) Continuous Integration - Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: (2) Continuous Integration - Run Tests
      run: |
        pytest

    - name: (3) Build - Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: (3) Build - Build and Push Docker Image
      run: |
        TAG=${{ github.sha }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/shopping-calc:$TAG .
        docker push ${{ secrets.DOCKER_USERNAME }}/shopping-calc:$TAG

    - name: (4) Deployment - Deploy to Kubernetes
      run: |
        TAG=${{ github.sha }}
        # Replace placeholders inside deployment manifest dynamically
        sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" deployment.yaml
        sed -i "s|IMAGE_TAG|$TAG|g" deployment.yaml
        
        # Setup Kubernetes access (assumes KUBECONFIG secret is configured for remote cluster)
        mkdir -p ~/.kube
        echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config
        
        kubectl apply -f deployment.yaml